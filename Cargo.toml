[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
arrow-array = "59.3.0"
arrow-ipc = "59.3.0"
arrow-schema = "59.3.0"
bytes = "1.12.1"
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd"] }
